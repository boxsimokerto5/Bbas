name: Build Android APK & AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Build to Capacitor Android
        run: npx cap sync android

      - name: Ensure Release Keystore is Ready
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan keystore dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "Menggunakan permanent keystore bawaan repositori..."
          fi
          ls -lh android/app/release.keystore

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'blockblast123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'blockblast' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'blockblast123' }}
        run: ./gradlew assembleRelease

      - name: Build Release AAB (Android App Bundle for Play Store)
        working-directory: android
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'blockblast123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'blockblast' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'blockblast123' }}
        run: ./gradlew bundleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlast-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlast-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
